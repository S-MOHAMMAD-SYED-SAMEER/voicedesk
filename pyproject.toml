[project]
name = "voicedesk"
version = "0.1.0"
description = "AI phone receptionist: answers a business line, books appointments, and hands off to a human when it should."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "anthropic>=1.5,<2",
    # The speech adapters are plain REST calls; no vendor SDK is needed for
    # either of them. Also what the test suite uses to drive the app.
    "httpx>=0.28",
    # Uvicorn serves the harness socket through this. Already arrived with
    # uvicorn[standard]; declared because the application now depends on it.
    "websockets>=14",
]

# Dependencies arrive with the milestone that first imports them, so an
# install never pulls in a library the code does not yet use.
#   m6: twilio
#   m8: an SMS or email client

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# The harness page is read from disk at request time, so it has to travel
# with the package.
[tool.setuptools.package-data]
"app.static" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
