<!doctype html>
<meta charset="utf-8">
<title>VoiceDesk harness</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px;
         max-width: 44rem; }
  h1 { font-size: 1.1rem; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.25rem; opacity: .7; }
  #status { display: inline-block; padding: .15rem .5rem; border-radius: .25rem;
            background: #8883; font-size: .85rem; }
  button { font: inherit; padding: .6rem 1.1rem; border-radius: .4rem;
           border: 1px solid #8886; background: #8881; cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #talk[data-recording="yes"] { background: #d9534f; color: #fff;
                                border-color: #d9534f; }
  .row { display: flex; gap: .5rem; align-items: center; margin: 1rem 0; }
  #log { margin-top: 1rem; }
  .turn { border-top: 1px solid #8883; padding: .6rem 0; }
  .who { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em;
         opacity: .6; }
  .fail { color: #d9534f; }
  .meta { font-size: .8rem; opacity: .6; }
</style>

<h1>VoiceDesk harness</h1>
<p class="sub">
  Two modes. <strong>Push</strong> is hold-to-talk: one complete utterance,
  one complete reply. <strong>Realtime</strong> streams continuously, ends
  your turn when you stop talking, and lets you interrupt the reply. No
  latency target is claimed in either.
</p>

<div class="row">
  <span id="status">disconnected</span>
  <span class="meta" id="callid"></span>
</div>

<div class="row">
  <button id="connect">Connect</button>
  <button id="talk" disabled>Hold to talk</button>
  <button id="live" disabled>Realtime: off</button>
  <button id="hangup" disabled>Hang up</button>
</div>
<div class="row">
  <span class="meta" id="level">level —</span>
</div>

<div id="log"></div>

<script>
const SAMPLE_RATE = 16000;
let sampleRate = SAMPLE_RATE;
const FRAME_MS = 20;
const els = {
  status: document.getElementById('status'),
  callid: document.getElementById('callid'),
  connect: document.getElementById('connect'),
  talk: document.getElementById('talk'),
  live: document.getElementById('live'),
  hangup: document.getElementById('hangup'),
  level: document.getElementById('level'),
  log: document.getElementById('log'),
};

let socket = null, audioContext = null, stream = null, node = null;
let chunks = [], recording = false;
// Realtime state: a continuous capture, and a playback queue that can be
// thrown away the moment the server says the caller interrupted.
let realtime = false, streaming = false, pending = new Float32Array(0);
let playAt = 0, playing = [], partialBox = null;

function setStatus(text) { els.status.textContent = text; }

function add(who, text, extra = '', failed = false) {
  const box = document.createElement('div');
  box.className = 'turn';
  const label = document.createElement('div');
  label.className = 'who' + (failed ? ' fail' : '');
  label.textContent = who;
  const body = document.createElement('div');
  body.textContent = text;
  box.append(label, body);
  if (extra) {
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = extra;
    box.append(meta);
  }
  els.log.prepend(box);
}

function play(bytes) {
  const url = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
  const audio = new Audio(url);
  audio.onended = () => URL.revokeObjectURL(url);
  audio.play().catch(() => URL.revokeObjectURL(url));
}

// --- realtime playback ----------------------------------------------------
// Chunks are headerless PCM, so they are queued as buffers scheduled back to
// back rather than handed to an <audio> element. That is also what makes them
// droppable: stopping a scheduled source is instant.

function playbackContext() {
  if (!audioContext || audioContext.state === 'closed') {
    audioContext = new AudioContext();
  }
  return audioContext;
}

function enqueue(bytes, rate) {
  const context = playbackContext();
  const samples = new Int16Array(bytes);
  const buffer = context.createBuffer(1, samples.length, rate);
  const channel = buffer.getChannelData(0);
  for (let i = 0; i < samples.length; i++) channel[i] = samples[i] / 32768;

  const source = context.createBufferSource();
  source.buffer = buffer;
  source.connect(context.destination);
  playAt = Math.max(playAt, context.currentTime);
  source.start(playAt);
  playAt += buffer.duration;
  playing.push(source);
  source.onended = () => { playing = playing.filter((s) => s !== source); };
}

function stopPlayback() {
  for (const source of playing) { try { source.stop(); } catch (e) { /* already done */ } }
  playing = [];
  playAt = 0;
}

function showPartial(text) {
  if (!partialBox) {
    partialBox = document.createElement('div');
    partialBox.className = 'turn';
    partialBox.innerHTML = '<div class="who">you (hearing…)</div><div></div>';
    els.log.prepend(partialBox);
  }
  partialBox.lastChild.textContent = text;
}

function clearPartial() {
  if (partialBox) { partialBox.remove(); partialBox = null; }
}

// Float32 samples at whatever the browser captured, down to 16-bit PCM at
// 16 kHz, then a WAV header. The server accepts nothing else.
function toWav(float32, inputRate) {
  const ratio = inputRate / SAMPLE_RATE;
  const length = Math.floor(float32.length / ratio);
  const view = new DataView(new ArrayBuffer(44 + length * 2));
  const put = (offset, text) => {
    for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i));
  };
  put(0, 'RIFF'); view.setUint32(4, 36 + length * 2, true); put(8, 'WAVE');
  put(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 1, true); view.setUint32(24, SAMPLE_RATE, true);
  view.setUint32(28, SAMPLE_RATE * 2, true); view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  put(36, 'data'); view.setUint32(40, length * 2, true);
  for (let i = 0; i < length; i++) {
    const sample = Math.max(-1, Math.min(1, float32[Math.floor(i * ratio)] || 0));
    view.setInt16(44 + i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
  }
  return view.buffer;
}

async function connect() {
  socket = new WebSocket(`ws://${location.host}/ws/harness`);
  socket.binaryType = 'arraybuffer';

  socket.onopen = () => setStatus('connected');
  socket.onclose = () => {
    setStatus('disconnected');
    els.connect.disabled = false;
    els.talk.disabled = els.hangup.disabled = els.live.disabled = true;
    stopPlayback();
    stopStreaming();
    stopCapture();
  };
  socket.onerror = () => setStatus('socket error');

  socket.onmessage = (event) => {
    if (typeof event.data !== 'string') {
      if (realtime) enqueue(event.data, sampleRate); else play(event.data);
      return;
    }
    const message = JSON.parse(event.data);
    if (message.type === 'ready') {
      els.callid.textContent = `call ${message.call_id}`;
      els.connect.disabled = true;
      els.talk.disabled = els.hangup.disabled = els.live.disabled = false;
      sampleRate = message.format.sample_rate || SAMPLE_RATE;
      setRealtime(!!message.realtime);
      add('agent', message.greeting, 'greeting — not a transcript turn');
    } else if (message.type === 'partial') {
      showPartial(message.text);
    } else if (message.type === 'clear') {
      stopPlayback();
      add('system', 'interrupted — queued audio discarded');
    } else if (message.type === 'mark') {
      // Playback of a batch finished. Nothing to show; kept for symmetry
      // with the carrier path, where it is how a turn's length is measured.
    } else if (message.type === 'mode') {
      setRealtime(message.realtime);
    } else if (message.type === 'turn') {
      clearPartial();
      const confidence = message.confidence == null
        ? '' : ` · confidence ${message.confidence}`;
      add('you', message.transcript || '(nothing heard)', confidence);
      const tools = message.tool_calls
        .map((t) => `${t.name}${t.success ? '' : ' (failed)'}`).join(', ');
      const timings = message.timings;
      add('agent', message.reply,
          `stt ${timings.stt_ms}ms · llm ${timings.llm_ms}ms · ` +
          `tts ${timings.tts_ms}ms · total ${timings.total_ms}ms` +
          (tools ? ` · ${tools}` : '') +
          (message.failure ? ` · ${message.failure} failed` : ''),
          message.failed);
    } else if (message.type === 'error') {
      add('system', `${message.reason}: ${message.detail}`, '', true);
    }
  };
}

async function startCapture() {
  if (recording) return;
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioContext = new AudioContext();
  const source = audioContext.createMediaStreamSource(stream);
  // ScriptProcessor is deprecated but needs no worklet file, no bundler and
  // no cross-origin isolation. This is a development harness.
  node = audioContext.createScriptProcessor(4096, 1, 1);
  chunks = [];
  node.onaudioprocess = (event) => {
    chunks.push(new Float32Array(event.inputBuffer.getChannelData(0)));
  };
  source.connect(node);
  node.connect(audioContext.destination);
  recording = true;
  els.talk.dataset.recording = 'yes';
  setStatus('listening');
}

function stopCapture() {
  if (node) { node.disconnect(); node.onaudioprocess = null; node = null; }
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  els.talk.dataset.recording = 'no';
  recording = false;
}

function sendUtterance() {
  if (!chunks.length || !socket || socket.readyState !== WebSocket.OPEN) return;
  const total = chunks.reduce((n, c) => n + c.length, 0);
  const merged = new Float32Array(total);
  let offset = 0;
  for (const chunk of chunks) { merged.set(chunk, offset); offset += chunk.length; }
  socket.send(toWav(merged, audioContext.sampleRate));
  setStatus('thinking');
  chunks = [];
}

// --- realtime capture -----------------------------------------------------
// The same ScriptProcessor, but instead of accumulating an utterance it emits
// fixed-length frames continuously. The server decides where turns begin and
// end; the browser only supplies audio and stops talking when told to.

function setRealtime(on) {
  realtime = on;
  els.live.textContent = `Realtime: ${on ? 'on' : 'off'}`;
  els.talk.disabled = on;
  if (on) startStreaming(); else stopStreaming();
}

async function startStreaming() {
  if (streaming) return;
  streaming = true;
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const context = playbackContext();
  const source = context.createMediaStreamSource(stream);
  node = context.createScriptProcessor(1024, 1, 1);
  pending = new Float32Array(0);

  node.onaudioprocess = (event) => {
    const input = event.inputBuffer.getChannelData(0);
    const merged = new Float32Array(pending.length + input.length);
    merged.set(pending); merged.set(input, pending.length);
    pending = merged;

    const ratio = context.sampleRate / sampleRate;
    const frame = Math.floor(sampleRate * FRAME_MS / 1000);
    const needed = Math.floor(frame * ratio);

    let peak = 0;
    while (pending.length >= needed) {
      const view = new DataView(new ArrayBuffer(frame * 2));
      for (let i = 0; i < frame; i++) {
        const value = Math.max(-1, Math.min(1, pending[Math.floor(i * ratio)] || 0));
        peak = Math.max(peak, Math.abs(value));
        view.setInt16(i * 2, value < 0 ? value * 0x8000 : value * 0x7fff, true);
      }
      if (socket && socket.readyState === WebSocket.OPEN) socket.send(view.buffer);
      pending = pending.slice(needed);
    }
    els.level.textContent = `level ${(peak * 100).toFixed(0)}%`;
  };

  source.connect(node);
  node.connect(context.destination);
  setStatus('listening (realtime)');
}

function stopStreaming() {
  if (!streaming) return;
  streaming = false;
  stopCapture();
  els.level.textContent = 'level —';
  setStatus('connected');
}

els.connect.onclick = connect;
els.live.onclick = () => {
  const next = !realtime;
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: 'mode', value: next ? 'realtime' : 'push' }));
  }
  setRealtime(next);
};
els.hangup.onclick = () => {
  if (socket) socket.send(JSON.stringify({ type: 'hangup' }));
  stopStreaming();
  stopCapture();
};
const press = (event) => {
  event.preventDefault();
  if (!realtime) startCapture();
};
const release = (event) => {
  event.preventDefault();
  if (realtime || !recording) return;
  stopCapture();
  if (audioContext) audioContext.close().then(() => {});
  sendUtterance();
};
els.talk.addEventListener('mousedown', press);
els.talk.addEventListener('touchstart', press);
window.addEventListener('mouseup', release);
window.addEventListener('touchend', release);
</script>
